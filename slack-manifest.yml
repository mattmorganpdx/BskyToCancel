display_information:
  name: BskyToCancel
  description: Reposts Bluesky posts in thread so nobody has to open bsky.app
  background_color: "#1185fe"
features:
  bot_user:
    display_name: BskyToCancel
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
